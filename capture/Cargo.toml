[package]
name = "nayutacast-capture"
version = "0.3.1"
edition = "2024"
description = "A cross-platform screen casting library implemented by Rust."
license = "LGPL-2.1-only"
readme = "../README.md"
repository = "https://github.com/nayutacast/nayutacast"

[dependencies]
thiserror = "2.0"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
common.workspace = true
resample.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
windows-capture = "=1.4.0"
windows = { version = "0.58", features = [
    "Win32_Media",
    "Win32_Media_MediaFoundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-media = { version = "0.3", package = "core-media-rs" }
screencapturekit = "0.3"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
glib = "0.19"
cpal = "0.15"
nix = { version = "0.29", features = ["mman", "ioctl", "fs"] }
memmap2 = "0.9"
libc = "0.2"
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.13", features = ["shm", "randr"] }
zbus = { version = "5", features = ["tokio", "blocking-api"] }

[features]
serde = []
