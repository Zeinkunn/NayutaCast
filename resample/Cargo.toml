[package]
name = "nayutacast-resample"
version = "0.3.1"
edition = "2024"
description = "A cross-platform screen casting library implemented by Rust."
license = "LGPL-2.1-only"
readme = "../README.md"
repository = "https://github.com/nayutacast/nayutacast"

[dependencies]
thiserror = "2.0"
common.workspace = true
[features]
default = []

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mman"] }
memmap2 = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
ffmpeg = { package = "ffmpeg-sys-next", version = "9.0", default-features = false, features = ["swresample"] }

[target.'cfg(target_os = "macos")'.dependencies]
ffmpeg = { package = "ffmpeg-sys-next", version = "9.0", default-features = false, features = ["swresample"] }

