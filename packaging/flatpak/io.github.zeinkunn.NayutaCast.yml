app-id: io.github.zeinkunn.NayutaCast
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: nayutacast-app
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  - --talk-name=org.freedesktop.portal.ScreenCast

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  - name: x264
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        branch: master
        commit: 0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure
        --prefix=${FLATPAK_DEST}
        --enable-gpl
        --enable-shared
        --disable-static
        --disable-doc
        --disable-programs
        --disable-indevs
        --disable-outdevs
        --enable-pthreads
        --enable-pic
        --enable-vaapi
        --enable-libdrm
        --enable-libx264
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    cleanup:
      - /share/ffmpeg
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.4.tar.xz
        sha256: 71f4aac3573ed9060489cb62526a6c7dda815ae10993789611acd7be9fa9fbf4

  - name: srt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DENABLE_APPS=OFF
      - -DENABLE_DEBUG=0
      - -DENABLE_ENCRYPTION=OFF
      - -DENABLE_SHARED=OFF
      - -DENABLE_STATIC=ON
      - -DENABLE_UNITTESTS=OFF
      - -DUSE_STATIC_LIBSTDCXX=ON
    sources:
      - type: archive
        url: https://github.com/Haivision/srt/archive/refs/tags/v1.5.4.tar.gz
        sha256: d0a8b600fe1b4eaaf6277530e3cfc8f15b8ce4035f16af4a5eb5d4b123640cdd

  - name: nayutacast
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      prepend-pkg-config-path: /app/lib/pkgconfig
      env:
        CARGO_HOME: /run/build/nayutacast/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
        RUSTFLAGS: -C link-arg=-Wl,-rpath,/app/lib
        SRT_LIB_DIR: /app/lib
    build-commands:
      - cargo build --offline --release --locked -p nayutacast-app -p nayutacast-server
      - install -Dm0755 target/release/nayutacast-app ${FLATPAK_DEST}/bin/nayutacast-app
      - install -Dm0755 target/release/nayutacast-server ${FLATPAK_DEST}/bin/nayutacast-server
      - install -Dm0644 packaging/flatpak/io.github.zeinkunn.NayutaCast.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 packaging/flatpak/io.github.zeinkunn.NayutaCast.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 packaging/flatpak/icons/512x512/io.github.zeinkunn.NayutaCast.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm0644 packaging/flatpak/icons/256x256/io.github.zeinkunn.NayutaCast.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm0644 packaging/flatpak/icons/128x128/io.github.zeinkunn.NayutaCast.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm0644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .flatpak-builder
          - build-dir
          - repo
          - '*.flatpak'
      - cargo-sources.json
