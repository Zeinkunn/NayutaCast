[package]
name = "nayutacast-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nayutacast-app"
path = "./src/main.rs"

[dependencies]
common = { workspace = true, features = ["serde"] }
nayutacast = { workspace = true, features = ["serde"] }
capture = { workspace = true }
discovery = { workspace = true }
codec = { workspace = true }
transport = { workspace = true }
eframe = { version = "0.37.0", default-features = true }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
dirs = "6.0"
env_logger = "0.11"
http = "1"
url = "2"
base64 = "0.22"
prost = "0.14"
roxmltree = "0.21"
if-addrs = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["compat"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.1"
