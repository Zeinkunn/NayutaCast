name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-${{ matrix.name }}

      - name: Build native release binaries
        run: cargo build --release --locked -p nayutacast-app -p nayutacast-server -p nayutacast-example

      - name: Stage CI build outputs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ci-dist
          cp target/release/nayutacast-app ci-dist/
          cp target/release/nayutacast-server ci-dist/
          cp target/release/nayutacast-example ci-dist/

      - name: Stage CI build outputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-dist | Out-Null
          Copy-Item target/release/nayutacast-app.exe ci-dist/
          Copy-Item target/release/nayutacast-server.exe ci-dist/
          Copy-Item target/release/nayutacast-example.exe ci-dist/

      - name: Upload CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nayutacast-ci-${{ matrix.name }}
          path: ci-dist/*
          retention-days: 7

  build-android:
    name: Build (android-arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust stable toolchain with Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-android-arm64

      - name: Install Android SDK 35, NDK 27 & build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config tclsh perl
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=${SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=35" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Cache Gradle packages
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android native Rust + Kotlin AAR and TV APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew :nayutacast:assembleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Stage and verify signed Android artifacts
        run: |
          mkdir -p android-dist
          cp -v android/build/outputs/aar/*.aar android-dist/
          APK_SRC="$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "${APK_SRC}"
          cp -v "${APK_SRC}" android-dist/nayutacast-android-tv.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose android-dist/nayutacast-android-tv.apk

      - name: Upload Android AAR and TV APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nayutacast-ci-android-arm64
          path: android-dist/*
          retention-days: 7

  build-flatpak:
    name: Build Flatpak (linux-x64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify generated Cargo Flatpak sources match Cargo.lock
        run: |
          python3 packaging/flatpak/generate-cargo-sources.py Cargo.lock -o /tmp/cargo-sources.json
          diff -u packaging/flatpak/cargo-sources.json /tmp/cargo-sources.json

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nayutacast-linux-x64.flatpak
          manifest-path: packaging/flatpak/io.github.zeinkunn.NayutaCast.yml
          arch: x86_64
          cache: true
          upload-artifact: false

      - name: Upload Flatpak CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: nayutacast-ci-flatpak-x64
          path: nayutacast-linux-x64.flatpak
          retention-days: 7
