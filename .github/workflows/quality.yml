name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt Check (Nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting across workspace
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Rust stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Clippy error gate (full workspace)
        run: cargo clippy --workspace --all-targets --locked

      - name: Clippy strict gate (native desktop app)
        run: cargo clippy -p nayutacast-app --all-targets --no-deps --locked -- -D warnings

  audit:
    name: Security Advisory Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run RustSec dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Upstream transitive advisories locked under libp2p 0.55.0 (hickory-proto 0.25.0-alpha.5, libp2p-gossipsub 0.48.0, libp2p-quic 0.12.0).
          ignore: RUSTSEC-2026-0118,RUSTSEC-2026-0119,RUSTSEC-2026-0487,RUSTSEC-2026-0489,RUSTSEC-2026-0490,RUSTSEC-2026-0491,RUSTSEC-2026-0505,RUSTSEC-2026-0511,RUSTSEC-2026-0512,RUSTSEC-2026-0514,RUSTSEC-2026-0525,RUSTSEC-2026-0530,RUSTSEC-2026-0531,RUSTSEC-2026-0534,RUSTSEC-2026-0535,RUSTSEC-2026-0536,RUSTSEC-2026-0537

  scripts-and-yaml:
    name: Shell & Workflow Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n run_native_app.sh
          bash -n packaging/flatpak/build-flatpak.sh

      - name: Validate workflow YAML, Flatpak metadata, and Cargo sources
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml desktop-file-utils
          desktop-file-validate packaging/flatpak/io.github.zeinkunn.NayutaCast.desktop
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          import yaml

          paths = sorted(
              glob.glob('.github/**/*.yml', recursive=True)
              + glob.glob('packaging/flatpak/*.yml')
          )
          if not paths:
              print("No YAML files found", file=sys.stderr)
              sys.exit(1)
          for p in paths:
              with open(p, 'r', encoding='utf-8') as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {p}")

          ET.parse('packaging/flatpak/io.github.zeinkunn.NayutaCast.metainfo.xml')
          print("Valid XML: packaging/flatpak/io.github.zeinkunn.NayutaCast.metainfo.xml")
          PY
          python3 packaging/flatpak/generate-cargo-sources.py Cargo.lock -o /tmp/cargo-sources.json
          diff -u packaging/flatpak/cargo-sources.json /tmp/cargo-sources.json
